name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx vsce package --allow-missing-repository --out 8086-lab-debug.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: 8086-lab-vsix-${{ matrix.os }}
          path: 8086-lab-debug.vsix
